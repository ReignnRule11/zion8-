receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  attributes:
    actions:
      - key: tenantId
        action: upsert
        from_attribute: tenant.id

exporters:
  prometheusremotewrite:
    endpoint: ${PROM_REMOTE_WRITE}
  otlp/tempo:
    endpoint: ${TEMPO_ENDPOINT}
  loki:
    endpoint: ${LOKI_ENDPOINT}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [loki]
