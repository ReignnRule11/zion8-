apiVersion: v1
kind: ServiceAccount
metadata:
  name: zion8-api
  namespace: zion8
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/zion8-api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: zion8
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: zion8
  labels:
    app.kubernetes.io/name: api
  annotations:
    secret.reloader.stakater.com/reload: zion8-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      serviceAccountName: zion8-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/reignnrule11/zion8-api:main
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: zion8-api
            - secretRef:
                name: zion8-api
          env:
            - name: OUTBOX_RELAY_ENABLED
              value: 'false'
            - name: MEMORY_WORKER_ENABLED
              value: 'false'
            - name: AI_WORKER_ENABLED
              value: 'false'
            - name: SERMON_WORKER_ENABLED
              value: 'false'
            - name: NOTIFICATION_WORKER_ENABLED
              value: 'false'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
