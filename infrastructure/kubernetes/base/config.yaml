apiVersion: v1
kind: ConfigMap
metadata:
  name: zion8-api
  namespace: zion8
data:
  NODE_ENV: production
  PORT: '4000'
  API_GLOBAL_PREFIX: api
  API_VERSION: '1'
  LOG_LEVEL: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zion8-web
  namespace: zion8
data:
  NODE_ENV: production
  PORT: '3000'
  API_INTERNAL_URL: http://api.zion8.svc.cluster.local:4000
  API_VERSION: '1'
