apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: zion8-images
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [zion8]
      validate:
        message: Images must not use the latest tag.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: '{{ element.image }}'
                    operator: Equals
                    value: '*:latest'
    - name: require-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [zion8]
      validate:
        message: Pods must run as non-root with a read-only root filesystem.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
