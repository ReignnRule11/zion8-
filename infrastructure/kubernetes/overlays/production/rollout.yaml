apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: zion8
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      serviceAccountName: zion8-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/reignnrule11/zion8-api:latest
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: zion8-api
            - secretRef:
                name: zion8-api
          env:
            - name: OUTBOX_RELAY_ENABLED
              value: 'false'
            - name: MEMORY_WORKER_ENABLED
              value: 'false'
            - name: AI_WORKER_ENABLED
              value: 'false'
            - name: SERMON_WORKER_ENABLED
              value: 'false'
            - name: NOTIFICATION_WORKER_ENABLED
              value: 'false'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    blueGreen:
      activeService: api
      previewService: api-preview
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 900
      prePromotionAnalysis:
        templates:
          - templateName: api-ready
---
apiVersion: v1
kind: Service
metadata:
  name: api-preview
  namespace: zion8
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-ready
  namespace: zion8
spec:
  metrics:
    - name: ready
      interval: 30s
      count: 5
      successCondition: result == 'ok' || result == 'degraded'
      provider:
        web:
          url: http://api-preview.zion8.svc.cluster.local:4000/api/v1/health/ready
          jsonPath: '{$.status}'
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web
  namespace: zion8
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      serviceAccountName: zion8-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/reignnrule11/zion8-web:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: zion8-web
            - secretRef:
                name: zion8-web
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    blueGreen:
      activeService: web
      previewService: web-preview
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 900
---
apiVersion: v1
kind: Service
metadata:
  name: web-preview
  namespace: zion8
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
