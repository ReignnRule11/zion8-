apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - rollout.yaml
images:
  - name: ghcr.io/reignnrule11/zion8-api
    newTag: latest
  - name: ghcr.io/reignnrule11/zion8-web
    newTag: latest
  - name: ghcr.io/reignnrule11/zion8-migrate
    newTag: latest
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
  - target:
      kind: ExternalSecret
      name: zion8-api
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: zion8-production/api
  - target:
      kind: ExternalSecret
      name: zion8-web
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: zion8-production/web
  - target:
      kind: Ingress
      name: zion8
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.zion8.example
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
      - op: replace
        path: /spec/scaleTargetRef/apiVersion
        value: argoproj.io/v1alpha1
      - op: replace
        path: /spec/scaleTargetRef/kind
        value: Rollout
  - target:
      kind: HorizontalPodAutoscaler
      name: web
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 15
      - op: replace
        path: /spec/scaleTargetRef/apiVersion
        value: argoproj.io/v1alpha1
      - op: replace
        path: /spec/scaleTargetRef/kind
        value: Rollout
  - target:
      kind: HorizontalPodAutoscaler
      name: workers
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: Deployment
      name: workers
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: web
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
