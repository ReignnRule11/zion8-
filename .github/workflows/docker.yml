name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  REVISION: ${{ github.sha }}

jobs:
  bake:
    name: Bake, sign and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "revision=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bake
        uses: docker/bake-action@v5
        with:
          workdir: infrastructure/docker
          files: docker-bake.hcl
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REVISION: ${{ steps.tag.outputs.revision }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.revision }}
        run: |
          for image in zion8-api zion8-web zion8-migrate; do
            cosign sign --yes "${REGISTRY}/${image}:${IMAGE_TAG}"
          done

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/zion8-api:${{ steps.tag.outputs.revision }}
          format: spdx-json
